server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PDF.js ships its module worker as .mjs; browsers require a JavaScript MIME type.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
