x-api-image: &api-build
  context: .
  dockerfile: server/Dockerfile

services:
  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build: *api-build
    image: schimmelpilz-api
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      LEGAL_DATA_DIR: /data/legal-sources
      COOKIE_SECURE: "true"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      PRICE_CURRENCY: ${PRICE_CURRENCY:-}
      PRICE_PERSONAL: ${PRICE_PERSONAL:-}
      PRICE_BUSINESS: ${PRICE_BUSINESS:-}
      PRICE_FIRM: ${PRICE_FIRM:-}
      CLIP_LINK_PERSONAL: ${CLIP_LINK_PERSONAL:-}
      CLIP_LINK_BUSINESS: ${CLIP_LINK_BUSINESS:-}
      CLIP_LINK_FIRM: ${CLIP_LINK_FIRM:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_LEGAL_FORM: ${OPERATOR_LEGAL_FORM:-}
      OPERATOR_REPRESENTATIVE: ${OPERATOR_REPRESENTATIVE:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_PHONE: ${OPERATOR_PHONE:-}
      OPERATOR_REGISTER: ${OPERATOR_REGISTER:-}
      OPERATOR_TAX_ID: ${OPERATOR_TAX_ID:-}
      OPERATOR_CONTENT_RESPONSIBLE: ${OPERATOR_CONTENT_RESPONSIBLE:-}
      OPERATOR_HOSTING: ${OPERATOR_HOSTING:-}
      OPERATOR_MAIL_PROVIDER: ${OPERATOR_MAIL_PROVIDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-true}
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
    volumes:
      - app_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Daily encrypted backup with verification. Copy /backups and the key volume off this server.
  backup:
    image: schimmelpilz-api
    restart: unless-stopped
    command: ["python", "-m", "server.backup_scheduler"]
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      BACKUP_KEY_FILE: /backup-keys/master.key
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-0}
    volumes:
      - app_data:/data
      - ${BACKUP_PATH:-./backups/docker}:/backups
      - backup_keys:/backup-keys
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      landing:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  app_data:
  caddy_data:
  caddy_config:
  backup_keys:
