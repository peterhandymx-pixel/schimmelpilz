services:
  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      LEGAL_DATA_DIR: /data/legal-sources
      COOKIE_SECURE: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - app_data:/data
    expose:
      - "8000"
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.35.1
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - landing
      - api

volumes:
  app_data:
  caddy_data:
  caddy_config:
  ollama_models:
