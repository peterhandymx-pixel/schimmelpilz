name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r server/requirements-dev.txt
      - run: python -m pytest -q server/tests

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: landing
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node --test tests/*.test.mjs

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: DOMAIN=example.com docker compose config -q

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
